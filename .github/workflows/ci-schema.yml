name: CI/CD - Schema

on:
  push:
    branches: [main, develop]
    paths:
      - "migrations/**"
      - "schema/**"
  pull_request:
    branches: [main]
    paths:
      - "migrations/**"
      - "schema/**"

jobs:
  validate:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PostgreSQL
        uses: harmon758/postgresql-action@v1
        with:
          postgresql version: "15"
          postgresql db: sovalune_test
          postgresql user: sovalune
          postgresql password: test_password

      - name: Install pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git postgresql-server-dev-15
          cd /tmp
          git clone --branch v0.8.0 https://github.com/pgvector/pgvector.git
          cd pgvector
          make
          sudo make install

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://sovalune:test_password@localhost:5432/sovalune_test
        run: |
          for migration in migrations/*.sql; do
            echo "Running $migration..."
            psql "$DATABASE_URL" -f "$migration"
          done

      - name: Verify schema
        env:
          DATABASE_URL: postgresql://sovalune:test_password@localhost:5432/sovalune_test
        run: |
          psql "$DATABASE_URL" -c "\dt" | grep -E "projects|sessions|messages|memory_entries|learning_cycles"
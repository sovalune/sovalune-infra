_format_version: "3.0"

services:
  - name: sovalune-api
    url: http://sovalune-core:8090
    routes:
      - name: sovalune-api-health
        paths:
          - /health
        strip_path: false
        methods:
          - GET
      - name: sovalune-api-v1
        paths:
          - /api/v1/
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Accept
      - name: sovalune-api-ws
        paths:
          - /ws/
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - Upgrade
                - Connection

  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1
        paths:
          - /auth/v1/
        strip_path: true

  - name: rest-v1
    url: http://api:3000/
    routes:
      - name: rest-v1
        paths:
          - /rest/v1/
        strip_path: true

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1
        paths:
          - /storage/v1/
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      exposed_headers:
        - X-Request-Id
      max_age: 3600
      credentials: true
